[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agents"
version = "0.1.0"
description = "Local worktree agent orchestration for ForgeVim"
requires-python = ">=3.9"

[project.scripts]
forge-agents = "forge_agents.cli:main"

[tool.setuptools.packages.find]
include = ["forge_agents*"]
